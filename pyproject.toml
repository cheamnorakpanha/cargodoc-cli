[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cargodoc"
version = "0.1.0"
description = "CargoDoc: an interactive import and export document workspace"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["prompt-toolkit>=3.0.43,<4", "rich>=13.7,<16"]

[project.scripts]
cargodoc = "cargodoc.cli:main"

[tool.setuptools.packages.find]
include = ["cargodoc*"]
